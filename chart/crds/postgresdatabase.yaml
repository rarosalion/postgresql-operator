apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresdatabases.db.rarosalion.github.io
spec:
  group: db.rarosalion.github.io
  scope: Namespaced
  names:
    plural: postgresdatabases
    singular: postgresdatabase
    kind: PostgresDatabase
    shortNames:
      - pgdb
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Database
          type: string
          jsonPath: .spec.databaseName
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [databaseName, username, passwordSecretRef]
              properties:
                databaseName:
                  type: string
                  description: Name of the database and the role that owns it.
                username:
                  type: string
                  description: Postgres role to create. Usually the same as databaseName.
                passwordSecretRef:
                  type: object
                  required: [name, key]
                  description: Secret in the same namespace as this resource holding the role's password.
                  properties:
                    name:
                      type: string
                    key:
                      type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                message:
                  type: string
                observedGeneration:
                  type: integer
