image:
  repository: ghcr.io/rarosalion/postgresql-operator
  tag: "0.1.2"

namespace: postgresql-operator

# Admin credentials for the target Postgres server. The operator is the only thing that ever reads
# this - it lives only in this release's own namespace, never mirrored to app namespaces. Set via
# --set or a separate values file kept out of git (or wire to Vault later via helmfile).
dbAdmin:
  host: postgres.example.com
  port: 5432
  user: ""
  password: ""
